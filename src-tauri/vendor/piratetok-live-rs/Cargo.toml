    "derive",
    "env",
]
optional = true

[dependencies.dotenvy]
version = "0.15.7"
optional = true

[dependencies.flate2]
version = "1"

[dependencies.futures-util]
version = "0.3"

[dependencies.http]
version = "1"

[dependencies.prost]
version = "0.14"

[dependencies.rand]
version = "0.9"

[dependencies.reqwest]
version = "0.12"
features = [
    "native-tls",
    "json",
]
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
