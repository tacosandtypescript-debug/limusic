[package]
edition = "2021"
name = "piratetok-live-rs"
version = "0.2.0"
authors = ["Zmole Cristian"]
build = "build.rs"
exclude = [
    ".env",
    ".env.example",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "TikTok Live WebSocket connector — real-time chat, gifts, likes, and viewer events. No authentication required."
homepage = "https://piratetok.boats"
documentation = "https://docs.rs/piratetok-live-rs"
readme = "README.md"
keywords = [
    "tiktok",
    "live",
    "stream",
    "websocket",
    "protobuf",
]
categories = [
    "api-bindings",
    "network-programming",
]
license = "0BSD"
repository = "https://github.com/PirateTok/live-rs"

[features]
cli = [
    "dep:clap",
    "dep:dotenvy",
    "dep:tracing-subscriber",
]

[lib]
name = "piratetok_live_rs"
path = "src/lib.rs"















[[test]]
name = "api_integration_test"
path = "tests/api_integration_test.rs"

[[test]]
name = "multi_stream_load_test"
path = "tests/multi_stream_load_test.rs"

[[test]]
name = "replay_test"
path = "tests/replay_test.rs"

[[test]]
name = "wss_smoke_test"
path = "tests/wss_smoke_test.rs"

[dependencies.base64]
version = "0.22"

[dependencies.clap]
version = "4.6.0"
