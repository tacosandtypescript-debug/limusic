[package]
name = "limusic-verify"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone on purpose. This crate sits inside the repository, which has a Cargo workspace, and
# without this line cargo refuses to guess: "current package believes it's in a workspace when it's
# not". It is not a member — it pulls the app's modules in through `#[path]` and must be buildable
# and runnable on its own, without libmpv, without Tauri and without a V8 static library.
[workspace]

# Compiles the Tauri-free parts of LiMusic on their own so their tests can actually be RUN: the
# Twitch modules (`auth.rs`, `api.rs`, `settings.rs`) and the overlay's routing.
#
# Why this exists: `cargo test -p limusic-app` has to link the whole app, and on Windows its test
# binary dies with `STATUS_ENTRYPOINT_NOT_FOUND` (0xc0000139) before running anything — so every test
# in the app was compiled and never executed. Those modules were written with an injected
# `reqwest::Client` and no `tauri::` / `crate::` imports precisely so this is possible.
#
# See `tools/README.md`. The dependency versions mirror `src-tauri/Cargo.toml` exactly; a divergence
# here would mean testing a different reqwest than the app ships.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
